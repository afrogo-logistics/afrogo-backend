version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 10

  wargames-runner:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app:cached
    command: sh -lc "npm ci && npm run build:packages && RUN_WAR_GAMES=1 npm test"
    depends_on:
      postgres:
        condition: service_healthy

# Usage:
# docker-compose up --build
# This will start Postgres and run the WarGames runner which executes the integration tests.
