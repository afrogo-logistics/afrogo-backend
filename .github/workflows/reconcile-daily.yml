name: Daily Billing Reconcile

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: [self-hosted, linux, vpc, aurora]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build packages
        run: npm run build:packages
      - name: Run reconcile script
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
        run: |
          # If you want this to run against staging Aurora, replace the PG_* envs with secrets in the repo
          node services/billing-service/tools/reconcile.js
