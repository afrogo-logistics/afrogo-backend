name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint) — changed files only
        # Run strict lint only on the files changed by this PR to enforce
        # good hygiene on newly touched code while we triage existing warnings.
        run: |
          npx eslint \
            services/ops-service/src/pg-client.ts \
            services/billing-service/src/ledger/merchant-ledger.ts \
            services/billing-service/src/lib/pdf-generator.ts \
            lib/pg-client.ts \
            lib/pdf-generator.ts \
            --ext .ts --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
